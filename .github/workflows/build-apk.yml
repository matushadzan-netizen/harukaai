name: Build HarukaAI offline APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK components
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.3.11579264" "cmake;3.22.1"

      - name: Fetch llama.cpp source (pinned for legacy llava API)
        run: |
          git clone --depth 1 --branch b4510 https://github.com/ggerganov/llama.cpp.git app/src/main/cpp/llama.cpp

      - name: Build debug APK
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compile APK
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/HarukaAI-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HarukaAI-debug-apk
          path: app/build/outputs/apk/debug/HarukaAI-debug.apk
          if-no-files-found: error
